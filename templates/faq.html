{% extends "base.html" %}
{% block extra_schema %}<script type="application/ld+json">{{ faq_schema|safe }}</script>{% endblock %}
{% block content %}
<section class="hero-in wrap">
  <span class="eyebrow" aria-hidden="true">FAQ</span>
  <h1>{{ t_h1 }}</h1>
</section>
<section class="sec wrap">
  <div class="faq-list">
    {% for q, a in items %}
    <details><summary><span>{{ q }}</span><span class="fx" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span></summary><div class="fa-body">{{ a }}</div></details>
    {% endfor %}
  </div>
</section>
<section class="cta-band wrap">
  <h2>{{ common.cta_title }}</h2>
  <p>{{ common.cta_sub }}</p>
  <a class="btn btn-blk" href="/{{ lang }}/aloqa/">{{ common.cta_button }}
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
</section>
{% endblock %}
