{% extends "base.html" %}
{% block extra_schema %}<script type="application/ld+json">{{ article_schema|safe }}</script>{% endblock %}
{% block content %}
<article class="wrap sec" style="max-width:760px">
  <span class="eyebrow">{{ p.date }}</span>
  <h1>{{ p.title }}</h1>
  {% if p.image %}<img src="{{ p.image }}" alt="" style="border-radius:16px;margin:1.2rem 0">{% endif %}
  <div style="white-space:pre-wrap;opacity:.92;font-size:1.02rem">{{ p.body }}</div>
</article>
<section class="cta-band wrap">
  <h2>{{ common.cta_title }}</h2>
  <p>{{ common.cta_sub }}</p>
  <a class="btn btn-acid" href="/{{ lang }}/aloqa/">{{ common.cta_button }}</a>
</section>
{% endblock %}
