<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emailni tasdiqlash — promtchi®</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blk:#0B0B0E;--cream:#F3EFE6;--blue:#2B2BFF;--acid:#D9FF3F;--coral:#FF4B2E;--w:#FCFBF7;--green:#22c55e;
  --anton:'Anton',sans-serif;--grot:'Space Grotesk',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--grot);background:var(--blk);color:var(--w);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:var(--cream);color:var(--blk);border:3px solid var(--blk);border-radius:16px;
  padding:2.5rem;width:100%;max-width:420px;box-shadow:8px 8px 0 rgba(217,255,63,.25);text-align:center}
h1{font-family:var(--anton);font-size:1.9rem;text-transform:uppercase;margin-bottom:.4rem}
h1 span{color:var(--coral)}
p{opacity:.7;margin-bottom:1.5rem;font-size:.92rem;line-height:1.5}
b{opacity:1}
button{width:100%;padding:.9rem;border-radius:999px;border:2.5px solid var(--blk);
  background:var(--blk);color:var(--w);font-weight:700;font-size:.96rem;cursor:pointer;transition:.18s;
  font-family:inherit}
button:hover{background:var(--blue)}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:1rem;font-size:.88rem;font-weight:600;min-height:1.3em}
.msg.err{color:var(--coral)}
.msg.ok{color:var(--green)}
.hide{display:none}
a.back{display:inline-block;margin-top:1.2rem;font-size:.85rem;opacity:.6;color:inherit;text-decoration:underline}
</style>
</head>
<body>

<div class="card">
  <div id="askView">
    <h1>Email <span>tasdiqlash</span></h1>
    <p>Admin panel email ro'yxatidagi o'zgarishni tasdiqlaysizmi? Bu havola faqat asosiy admin uchun yuborilgan.</p>
    <button id="confirmBtn">Tasdiqlash</button>
    <div class="msg" id="msg"></div>
  </div>
  <div id="doneView" class="hide">
    <h1>Tayyor <span>✓</span></h1>
    <p id="doneText"></p>
    <a class="back" href="/admin">Admin panelga o'tish →</a>
  </div>
</div>

<script>
function $(id){return document.getElementById(id);}
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
const msg = $('msg');

if (!token) {
  msg.className = 'msg err';
  msg.textContent = "Havola noto'g'ri — token topilmadi.";
  $('confirmBtn').disabled = true;
}

$('confirmBtn').onclick = async () => {
  const btn = $('confirmBtn');
  btn.disabled = true;
  msg.className = 'msg'; msg.textContent = 'Tasdiqlanmoqda...';
  try {
    const r = await fetch('/api/auth/confirm-token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token })
    });
    if (r.ok) {
      const data = await r.json();
      if (data.action === 'set_primary') {
        $('doneText').innerHTML = `Asosiy admin muvaffaqiyatli almashtirildi: <b>${data.email || ''}</b>`;
      } else if (data.action === 'add_email') {
        $('doneText').innerHTML = `Hisob yaratildi va faollashtirildi: <b>${data.email || ''}</b><br><span style="opacity:.7;font-size:.85em">Login ma'lumotlari Telegram admin(lar)ga yuborildi.</span>`;
      } else {
        $('doneText').innerHTML = `Email muvaffaqiyatli o'chirildi: <b>${data.email || ''}</b>`;
      }
      $('askView').classList.add('hide');
      $('doneView').classList.remove('hide');
    } else {
      const d = await r.json().catch(() => ({}));
      msg.className = 'msg err';
      msg.textContent = (typeof d.detail === 'string' && d.detail) || "Havola noto'g'ri yoki muddati tugagan";
      btn.disabled = false;
    }
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = "Server bilan aloqa yo'q";
    btn.disabled = false;
  }
};
</script>
</body>
</html>
