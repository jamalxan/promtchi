<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parolni tiklash — promtchi®</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--blk:#0B0B0E;--cream:#F3EFE6;--blue:#2B2BFF;--acid:#D9FF3F;--coral:#FF4B2E;--w:#FCFBF7;--green:#22c55e;
  --anton:'Anton',sans-serif;--grot:'Space Grotesk',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--grot);background:var(--blk);color:var(--w);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:1.5rem}
.card{background:var(--cream);color:var(--blk);border:3px solid var(--blk);border-radius:16px;
  padding:2.5rem;width:100%;max-width:420px;box-shadow:8px 8px 0 rgba(217,255,63,.25)}
h1{font-family:var(--anton);font-size:1.9rem;text-transform:uppercase;margin-bottom:.4rem}
h1 span{color:var(--coral)}
p{opacity:.7;margin-bottom:1.5rem;font-size:.92rem;line-height:1.5}
label{display:block;font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:.4rem}
.field{margin-bottom:1rem}
input{width:100%;padding:.85rem 1rem;border:2.5px solid var(--blk);border-radius:10px;
  font-size:1rem;background:var(--w);outline:none;transition:.2s;font-family:inherit}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(43,43,255,.12)}
button{width:100%;margin-top:.6rem;padding:.9rem;border-radius:999px;border:2.5px solid var(--blk);
  background:var(--blk);color:var(--w);font-weight:700;font-size:.96rem;cursor:pointer;transition:.18s;
  font-family:inherit}
button:hover{background:var(--blue)}
button:disabled{opacity:.5;cursor:not-allowed}
.msg{margin-top:1rem;font-size:.88rem;font-weight:600;min-height:1.3em}
.msg.err{color:var(--coral)}
.msg.ok{color:var(--green)}
.hide{display:none}
a.back{display:inline-block;margin-top:1.2rem;font-size:.85rem;opacity:.6;color:inherit;text-decoration:underline}
</style>
</head>
<body>

<div class="card">
  <div id="formView">
    <h1>Yangi <span>parol</span></h1>
    <p>Yangi parolingizni kiriting.</p>
    <div class="field"><label>Yangi parol</label><input id="pw1" type="password" autocomplete="new-password" placeholder="Kamida 8 belgi"></div>
    <div class="field"><label>Parolni tasdiqlang</label><input id="pw2" type="password" autocomplete="new-password" placeholder="Qayta kiriting"></div>
    <button id="submitBtn">Parolni o'rnatish</button>
    <div class="msg" id="msg"></div>
  </div>
  <div id="doneView" class="hide">
    <h1>Tayyor <span>✓</span></h1>
    <p>Parolingiz muvaffaqiyatli o'zgartirildi. Endi admin panelga yangi parol bilan kirishingiz mumkin.</p>
    <a class="back" href="/admin">Admin panelga o'tish →</a>
  </div>
</div>

<script>
function $(id){return document.getElementById(id);}
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';
const msg = $('msg');

if (!token) {
  msg.className = 'msg err';
  msg.textContent = "Havola noto'g'ri — token topilmadi.";
  $('submitBtn').disabled = true;
}

$('submitBtn').onclick = async () => {
  const pw1 = $('pw1').value;
  const pw2 = $('pw2').value;
  if (pw1.length < 8) { msg.className = 'msg err'; msg.textContent = "Parol kamida 8 belgi bo'lishi kerak"; return; }
  if (pw1 !== pw2) { msg.className = 'msg err'; msg.textContent = 'Parollar mos kelmadi'; return; }
  const btn = $('submitBtn');
  btn.disabled = true;
  msg.className = 'msg'; msg.textContent = 'Yuborilmoqda...';
  try {
    const r = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: pw1, confirm_password: pw2 })
    });
    if (r.ok) {
      $('formView').classList.add('hide');
      $('doneView').classList.remove('hide');
    } else {
      const d = await r.json().catch(() => ({}));
      msg.className = 'msg err';
      msg.textContent = (d.detail && (typeof d.detail === 'string' ? d.detail : "Havola noto'g'ri yoki muddati tugagan")) || "Havola noto'g'ri yoki muddati tugagan";
      btn.disabled = false;
    }
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = "Server bilan aloqa yo'q";
    btn.disabled = false;
  }
};
</script>
</body>
</html>
